[project]
name = "gravitywell"
version = "0.1.1"
description = "A third-party, typed Python client for the Pi-hole v6 REST API"
readme = "README.md"
authors = [
    { name = "slatecipher", email = "25094255+slatecipher@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["pi-hole", "dns", "ad-blocking", "api", "client", "httpx2", "pydantic", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.10",
    "clientx>=0.6.0",
    # Imported directly (`PiHoleAuth` is an `httpx2.Auth`), not only through ClientX.
    "httpx2>=2.10.0",
    "pydantic>=2.12.5",
]

[project.urls]
Repository = "https://github.com/slatecipher/gravitywell"
Documentation = "https://github.com/slatecipher/gravitywell/tree/mainline/docs"
Issues = "https://github.com/slatecipher/gravitywell/issues"
Changelog = "https://github.com/slatecipher/gravitywell/blob/mainline/CHANGELOG.md"

[project.optional-dependencies]
# `gravitywell.mcp` and the `gravitywell-mcp` command: an MCP server for the
# AI tools, on FastMCP.
mcp = ["click>=8.1", "clientx[fastmcp]>=0.6.0", "python-dotenv>=1.1"]

[project.scripts]
gravitywell-mcp = "gravitywell.mcp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The `mcp` extra's dependencies, so tests and pyright see them.
    "click>=8.1",
    "clientx[fastmcp]>=0.6.0",
    "pyright>=1.1.411",
    "python-dotenv>=1.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.10",
]

[tool.pytest]
addopts = ["--import-mode=importlib", "-vv", "--cov=gravitywell", "--cov-report=term-missing"]
# All of pytest's strictness checks. pytest may add more in a release; uv.lock pins it,
# so a new one shows up in the Dependabot PR that upgrades pytest, not on mainline.
strict = true

[tool.pyright]
# Editors check every tree. CI splits them: `make typecheck` passes `src`,
# `docs_src` and `scripts` on the command line (which overrides this list) and
# gates the build, while `make typecheck-tests` covers `test` as a non-blocking
# report.
include = ["src", "test", "docs_src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# The shipped package, the docs' samples and scripts are held to strict mode;
# tests stay on standard.
strict = ["src", "docs_src", "scripts"]
