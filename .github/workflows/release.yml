name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds the package and publishes it to
# TestPyPI, then PyPI. A manual run publishes to TestPyPI only, as a dry run.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default; the publish jobs ask for the OIDC token they need.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Check the release tag matches the project version
        if: github.event_name == 'release'
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match project version ${version} (expected v${version})"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check package metadata
        run: uvx twine check --strict dist/*

      - name: Smoke-test the wheel in a clean environment
        run: uv run --isolated --no-project --with dist/*.whl python -c "import gravitywell; print(gravitywell.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gravitywell
    permissions:
      id-token: write # Trusted Publishing; no API token is stored

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dry run may already have uploaded this version.
          skip-existing: true

  publish-pypi:
    needs: publish-testpypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gravitywell
    permissions:
      id-token: write # Trusted Publishing; no API token is stored

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
